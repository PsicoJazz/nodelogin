<!DOCTYPE html> 
<html lang="en">    

<head>
    <meta charset="UTF-8">
    <title>Registrar - Sistema de Vendas</title>
    


</head>
<body>


    <form class="container">

        <h1>Registrar - Sistema de Vendas</h1>

        <div>
            
            <label for="email"><b>Email:</b></label><br>
            <input type="email" id="email" name="email" placeholder="Seu Email" oninput="onchangeEmail()">
            <div class="error" id="email-error">Email é inválido</div>

            <label for="password"><b>Senha:</b></label><br>
            <input type="password" id="password" name="password" placeholder="Senha acima de 5 caracteres" onchange="onchangePassword()">
            <div class="error" id="password-error">A senha, obrigatória. Acima de 5 caracteres</div>
            <span class="eye" onclick="togglePasswordVisibility(); return false;">👁</span>

            <label for="confirmPassword"><b>Confirmar Senha:</b></label><br>    
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar Senha" onchange="onchangeConfirmPassword()">
            <div class="error" id="confirmPassword-error">As senhas não coincidem</div>
            
        </div>


        <div>

            <button type="button" class="registrar" onclick="register()">Registrar</button>
                onclick="register()" id="register-button"
            <button type="button" class="voltar" onclick="goBack()">Voltar para Login</button>

        </div>



    </form>

</body>

<script src="script.js"></script>
<script src="register.js"></script>
<script src="../../validations.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth-compat.js"></script>
<script src="../../firebase-init.js"></script>

<link rel="stylesheet" href="../../index.css">
<link rel="stylesheet" href="register.css">


</html>
