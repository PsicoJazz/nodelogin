<!DOCTYPE html> 
<html lang="en">    

<head>
    <meta charset="UTF-8">
    <title>Registrar - Sistema de Vendas</title>
    


</head>
<body>


    <form class="container">

        <h1>Registrar - Sistema de Vendas</h1>

        <div>
            
            <label for="email"><b>Email:</b></label><br>
            <input type="email" id="email" name="email" placeholder="Seu Email">

            <label for="password"><b>Senha:</b></label><br>
            <input type="password" id="password" name="password" placeholder="Senha acima de 5 caracteres">

            <label for="confirmPassword"><b>Confirmar Senha:</b></label><br>    
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar Senha">

        </div>


        <div>

            <button type="button" class="registrar" onclick="register()">Registrar</button>
            <button type="button" class="voltar" onclick="goBack()">Voltar para Login</button>

        </div>





</body>

<script src="script.js"></script>
<link rel="stylesheet" href="../../index.css">
<link rel="stylesheet" href="register.css">

</html>
