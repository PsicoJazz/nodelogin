<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> Cadastrode Vendas </title>
<link rel="stylesheet" href="home.css">
</head>

<body><br>

<div class="container">

<h2> Cadastro de Vendas </h2><br>


<form id="formVenda">

<input type="text" id="cliente" placeholder="Cliente" required>

<input type="text" id="produto" placeholder="Produto" required>

<input type="date" id="data" required>

<input type="number" id="preco" placeholder="Preço" required>

<div class="botoes">
<button class="btn-salvar" onclick="alert('Venda Salva!')">Salvar</button>
<button class="btn-alterar" onclick="alert('Venda Alterada!')">Alterar</button>
<button class="btn-deletar" onclick="alert('Venda Deletada!')">Deletar</button>

</div>

</form><br>

<h3>Lista de Vendas</h3><br>

<table>

<thead>
<tr>
<th>Cliente</th>
<th>Produto</th>
<th>Data</th>
<th>Preço</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="tabela"></tbody>

</table>



</body>
</html>
