<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>LOGIN - Sistema de Vendas</title>

  <link rel="stylesheet" href="index.css">

  <meta name="description" content="Sistema de Vendas">
</head>

<body>


<div class="container">
  <h1>Login - Sistema de Vendas</h1>

  <form>

    <div>
  <label for="email"><b>Email:</b></label><br>
  <input type="email" id="email" name="email" oninput="validateFields()" placeholder="seu@email.com" required>
  <div class="error email-error">Email é inválido</div>
</div>

<label for="password"><b>Senha:</b></label><br>
<input type="password" id="password" name="password" oninput="validateFields()" placeholder="sua senha" required>
<span class="eye" onclick="togglePasswordVisibility(); return false;">👁</span>

<div class="error password-error">A senha é inválida</div>
    <div>
      <button type="button" class="entrar" onclick="login()">Entrar</button>
      <button type="button" class="registrar" onclick="register()">Registrar</button>
      <button type="button" class="esqueci" onclick="recoverPassword()">Recuperar minha senha</button>
    </div>

  </form>
</div>


</body>



<script src="script.js"></script>
<script src="validations.js"></script>
